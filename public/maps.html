<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRAT - V Maps Navigation Engine</title>
    <link rel="stylesheet" href="/css/virat-core.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        .map-header { background: #1b5e20; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .map-header h1 { margin: 0; font-size: 20px; }
        .nav-back { color: #fff; text-decoration: none; font-weight: bold; }
        .controls-bar { padding: 10px 20px; background: #fff; display: flex; gap: 10px; border-bottom: 1px solid #ddd; }
        .controls-bar input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-map { padding: 8px 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-map:hover { background: #1b5e20; }
        #map { width: 100%; height: calc(100vh - 120px); min-height: 400px; }
    </style>
</head>
<body>
    <div class="map-header">
        <h1>🗺️ VIRAT V Maps Engine</h1>
        <a href="/" class="nav-back">← Back to Home</a>
    </div>

    <div class="controls-bar">
        <input type="text" id="searchInput" placeholder="Enter landmark or location name (e.g. New Delhi)...">
        <button class="btn-map" onclick="searchLocation()">Search Location</button>
        <button class="btn-map" style="background:#0277bd;" onclick="locateUser()">📍 My Location</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([20.5937, 78.9629], 5); // Default: India

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | VIRAT V Maps'
        }).addTo(map);

        let currentMarker = null;

        function locateUser() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    map.setView([lat, lon], 14);

                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup("<b>Your Current Location</b>").openPopup();
                }, () => {
                    alert("Unable to access GPS location. Please check browser permissions.");
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        async function searchLocation() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 13);

                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${data[0].display_name}</b>`).openPopup();
                } else {
                    alert("Location not found. Please try another search.");
                }
            } catch (e) {
                alert("Search service currently unavailable.");
            }
        }
    </script>
</body>
</html>
