<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIRAT Admin Dashboard</title>
<style>
body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial}
main{max-width:900px;margin:auto}
h1{color:#ffca28}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.card{background:#1d2b40;padding:20px;border-radius:14px}
.number{font-size:30px;font-weight:bold;color:#ffca28}
input,button{padding:12px;margin:5px 0;border:0;border-radius:8px}
input{max-width:100%;box-sizing:border-box}
button{background:#ffca28;color:#111;font-weight:bold}
section{margin:22px 0;background:#1d2b40;padding:16px;border-radius:14px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>VIRAT Admin Dashboard</h1>
<p id="message">Checking admin access...</p>
<div class="cards">
<div class="card">Users<div class="number" id="users">-</div></div>
<div class="card">Services<div class="number" id="services">-</div></div>
<div class="card">Activities<div class="number" id="activities">-</div></div>
</div>
<section>
<h2>Add Service</h2>
<input id="name" placeholder="Service name">
<input id="category" placeholder="Category">
<button onclick="addService()">Add Service</button>
</section>
<section><h2>Users</h2><pre id="userList">Loading...</pre></section>
<section><h2>Services</h2><pre id="serviceList">Loading...</pre></section>
<section><h2>Recent Activity</h2><pre id="activityList">Loading...</pre></section>
</main>
<script>
async function api(url, options={}) {
  const r=await fetch(url,{credentials:"same-origin",...options,
    headers:{"Content-Type":"application/json",...(options.headers||{})}});
  const data=await r.json();
  if(!r.ok) throw Error(data.message||"Request failed");
  return data;
}
async function load(){
  try{
    const d=await api("/api/admin/overview");
    users.textContent=d.users;
    services.textContent=d.services;
    activities.textContent=d.activities;
    userList.textContent=JSON.stringify(await api("/api/admin/users"),null,2);
    serviceList.textContent=JSON.stringify(await api("/api/admin/services"),null,2);
    activityList.textContent=JSON.stringify(await api("/api/admin/activity"),null,2);
    message.textContent="Admin access verified";
  }catch(e){message.textContent=e.message;}
}
async function addService(){
  try{
    const d=await api("/api/admin/services",{method:"POST",
      body:JSON.stringify({name:name.value,category:category.value})});
    message.textContent=d.message;
    name.value="";category.value="";
    load();
  }catch(e){message.textContent=e.message;}
}
load();
</script>
</body>
</html>
