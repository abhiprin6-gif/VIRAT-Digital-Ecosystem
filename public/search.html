<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRAT - V Search & AI Gateway</title>
    <link rel="stylesheet" href="/css/virat-core.css">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 32px; font-weight: bold; color: #1a237e; }
        .logo span { color: #ff9800; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex: 1; padding: 14px; border: 2px solid #1a237e; border-radius: 6px; font-size: 16px; }
        .btn-search { padding: 14px 24px; background: #1a237e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-search:hover { background: #0d47a1; }
        .mode-toggle { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .mode-btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #1a237e; color: #fff; border-color: #1a237e; }
        .results-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        .ai-response { background: #e8eaf6; padding: 15px; border-left: 4px solid #1a237e; border-radius: 4px; font-size: 15px; line-height: 1.5; }
        .nav-back { display: inline-block; margin-bottom: 15px; color: #1a237e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-back">← Back to VIRAT Ecosystem Home</a>
        <header>
            <div class="logo">VIRAT <span>Search & AI</span></div>
            <p>Smart multi-service search engine and instant AI assistant</p>
        </header>

        <div class="mode-toggle">
            <button class="mode-btn active" id="btnModeWeb" onclick="setMode('web')">🌐 V Search (Web)</button>
            <button class="mode-btn" id="btnModeAI" onclick="setMode('ai')">🤖 VIRAT AI Assistant</button>
        </div>

        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Ask VIRAT AI or search ecosystem services..." onkeypress="handleKeyPress(event)">
            <button class="btn-search" onclick="executeSearch()">Search</button>
        </div>

        <div class="results-card" id="resultsContainer">
            <h3 id="resultTitle">Search Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        let currentMode = 'web';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeWeb').classList.toggle('active', mode === 'web');
            document.getElementById('btnModeAI').classList.toggle('active', mode === 'ai');
            document.getElementById('queryInput').placeholder = mode === 'web' 
                ? "Search services, government portals, or web..." 
                : "Ask VIRAT AI any question...";
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') executeSearch();
        }

        async function executeSearch() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('resultsContainer');
            const resultTitle = document.getElementById('resultTitle');
            const resultContent = document.getElementById('resultContent');

            resultsContainer.style.display = 'block';

            if (currentMode === 'ai') {
                resultTitle.innerText = "🤖 VIRAT AI Response";
                resultContent.innerHTML = `<div class="ai-response">Processing query: <strong>"${query}"</strong><br><br>VIRAT AI Engine is initialized. Integrated response gateway ready for automated knowledge retrieval.</div>`;
            } else {
                resultTitle.innerText = "🌐 V Search Directory Match";
                resultContent.innerHTML = `
                    <p>Search query: <strong>"${query}"</strong></p>
                    <ul>
                        <li><a href="/services.html" style="color:#1a237e; font-weight:bold;">View Matched VIRAT Ecosystem Services Directory →</a></li>
                        <li><a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="color:#007bff;">Open External Web Results for "${query}" →</a></li>
                    </ul>
                `;
            }
        }
    </script>
</body>
</html>
